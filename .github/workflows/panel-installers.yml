name: Panel installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a public release under this tag (e.g. panel-v0.1.0); empty builds artifacts only'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'groundwork-panel/**'
      - '.github/workflows/panel-installers.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: groundwork-panel
    env:
      # Unsigned prototype builds: skip code-signing discovery on macOS.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-panel-${{ runner.os }}
          path: |
            groundwork-panel/dist-installers/*.dmg
            groundwork-panel/dist-installers/*.exe
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create public release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Groundwork Panel ${{ inputs.release_tag }}" \
            --notes "Early access preview of Groundwork Panel: every security console, one glance, keys never leave your machine. Unsigned builds; see the download page for first-open steps on Mac and Windows."
