<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  /* 9:16 background frame the demo video is overlaid onto. The middle band
     (between header and footer) is where the 1080x-wide video sits. */
  #frame {
    width: 1080px; height: 1920px; color: #101f38; display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 82% 3%, rgba(47,107,255,0.32), transparent 62%),
      radial-gradient(700px 560px at -4% 20%, rgba(139,92,246,0.20), transparent 60%),
      radial-gradient(820px 700px at 14% 99%, rgba(255,138,76,0.24), transparent 62%),
      #f2f5fc;
  }
  .header { padding: 90px 80px 0; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 40px; margin-bottom: 30px; }
  .brand .mark { width: 66px; height: 66px; flex-shrink: 0; }
  .header h1 { font-size: 66px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; }
  /* Reserve the video band: header ~470px, video 1080x608 centered, footer rest */
  .videoband { height: 700px; }
  .footer { flex: 1; padding: 0 80px 120px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .footer .cta { display: inline-block; background: linear-gradient(180deg, #5087ff, #8b5cf6); color: #fff; font-weight: 800; font-size: 44px; padding: 26px 0; border-radius: 22px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 18px 40px -18px rgba(7,103,128,0.8); }
  .footer .url { color: #4e6382; font-size: 40px; font-weight: 700; }
  .footer .free { color: #0d7a52; font-weight: 800; font-size: 34px; }
</style>
</head>
<body>
  <div id="frame">
    <div class="header">
      <div class="brand"><svg class="mark" viewBox="0 0 100 100"><polygon points="44,22 62,31 44,40 26,31" fill="#ffbe8f"/><polygon points="26,31 44,40 44,47 26,38" fill="#ff8b3d"/><polygon points="62,31 44,40 44,47 62,38" fill="#e86f1f"/><polygon points="56,38 74,47 56,56 38,47" fill="#8fb0ff"/><polygon points="38,47 56,56 56,63 38,54" fill="#2f6bff"/><polygon points="74,47 56,56 56,63 74,54" fill="#1d4ed8"/><polygon points="44,54 62,63 44,72 26,63" fill="#b79bf7"/><polygon points="26,63 44,72 44,79 26,70" fill="#8b5cf6"/><polygon points="62,63 44,72 44,79 62,70" fill="#6d28d9"/></svg> Groundwork</div>
      <h1>Someone clicked<br />the wrong link. Now what?</h1>
    </div>
    <div class="videoband"></div>
    <div class="footer">
      <div class="free">Playbooks for the bad days · Free</div>
      <div class="cta">Be ready before it happens</div>
      <div class="url">groundwork-security.com</div>
    </div>
  </div>
</body>
</html>
